[project]
name = "rag"
version = "0.1.0"
description = "RAG Pipeline for Folio"
authors = [
    { name = "AmlanJSarmah", email = "amlan.j.sarmah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.159.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
